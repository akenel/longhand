# =============================================================
# Longhand — the writing desk. LOCAL by default.
#
# This file stands up VS Code in a browser, configured as a
# distraction-free markdown editor, on YOUR machine only. It binds to
# 127.0.0.1 — nothing is exposed to the network, so no auth is needed
# and nothing can reach it but you.
#
#   docker compose up -d    ->    http://127.0.0.1:8443
#
# Point it at what you're writing:
#   echo 'WRITING_DIR=/home/angel/repos/freehold/docs/human-green/book' >> .env
#
# To put it on the box behind Keycloak, add the prod overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Read the header of that file first — it hands a browser terminal to
# whoever gets through the login, and that deserves a decision, not a
# default.
# =============================================================
name: longhand

services:
  code-server:
    image: ${CODE_SERVER_IMAGE:-codercom/code-server:4.104.3}
    restart: unless-stopped

    # 127.0.0.1 ONLY. Not 0.0.0.0. This is a text editor with a terminal
    # in it; the loopback bind is the security model until the prod
    # overlay replaces it with Keycloak.
    ports:
      - "127.0.0.1:${LONGHAND_PORT:-8443}:8080"

    # Seed the writing settings on FIRST run only, then hand off to
    # code-server.
    #
    # `cp -n` is the whole trick: it never overwrites. So the shipped
    # defaults land once, and after that the file belongs to you — change
    # the zoom with Ctrl+= or edit any setting in the UI and it sticks
    # across restarts.
    #
    # An earlier version bind-mounted settings.json read-only, which
    # looked tidy and quietly made every setting in the editor
    # unchangeable. Ctrl+= appeared to work and reverted on reload.
    #
    # To go back to the shipped defaults:
    #   docker compose down && docker volume rm longhand_longhand_data
    #
    # No password: nothing but this machine can reach the port above.
    # The prod overlay flips that decision, not this file.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /home/coder/.local/share/code-server/User
        [ -s /home/coder/.local/share/code-server/User/settings.json ] \
          || cp /defaults/settings.json /home/coder/.local/share/code-server/User/settings.json
        exec /usr/bin/entrypoint.sh \
          --bind-addr 0.0.0.0:8080 \
          --auth none --disable-telemetry /home/coder/writing

    environment:
      DOCKER_USER: coder

    # Run as you, so files you create are yours and not root's. The
    # default 1000:1000 matches most single-user Linux boxes; override in
    # .env if `id -u` says otherwise.
    user: "${LONGHAND_UID:-1000}:${LONGHAND_GID:-1000}"

    volumes:
      # What you're writing. ONLY this. Do not mount the whole home
      # directory "for convenience" — the blast radius of a browser tab
      # is the reason this line is narrow.
      - ${WRITING_DIR:-./workspace}:/home/coder/writing

      # The shipped DEFAULTS: theme, serif font, comfort zoom, 80-column
      # wrap, no line numbers, no autocomplete. Read config/settings.json
      # — it is the whole "distraction-free editor" feature.
      #
      # Mounted at /defaults and copied in on first run, NOT mounted over
      # the live settings file. That's what keeps the editor's own
      # settings editable (see the command above).
      - ./config:/defaults:ro

      # Extensions, editor state and your LIVE settings.
      #
      # A host directory, not a named volume, for one reason: a named
      # volume is created root-owned, and this container runs as you
      # (uid 1000), so code-server couldn't write its own logs and died
      # on EACCES. A bind mount inherits ./data's ownership, which is
      # yours.
      #
      # Bonus: your live settings.json is right here on the host at
      # ./data/User/settings.json — readable and editable without going
      # through the container.
      - ./data:/home/coder/.local/share/code-server

    mem_limit: ${LONGHAND_MEM:-1024m}
